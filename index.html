const products=()=>sec('Products',tbl(['Product','Retail price (₹)','Bulk price (₹)','Purchase price (₹, admin only)','Margin','GST %','Store'],P.map(p=>[`${p.e} ${esc(p.n)}`,`<input type='number' min='1' data-ch='pp' data-id='${p.id}' value='${p.p}'>`,`<input type='number' min='0' data-ch='pb' data-id='${p.id}' value='${p.b||''}' placeholder='Same as retail'>`,`<input type='number' min='0' data-ch='pc' data-id='${p.id}' value='${p.pc||''}'>`,p.pc?Math.round((p.p-p.pc)/p.p*100)+'% retail, '+Math.round(((p.b||p.p)-p.pc)/(p.b||p.p)*100)+'% bulk':'Set purchase price',`<input type='number' min='0' data-ch='pg' data-id='${p.id}' value='${p.g||18}'>`,`<button data-do='hide' data-id='${p.id}'>${p.off?'Show':'Hide'}</button>`]),''),'Prices are before GST')+sec('Add a product',`<div class='f addf'><input id='an' placeholder='Product name'><select id='ac'>${CATS.slice(1).map(c=>`<option value='${c[0]}'>${c[2]}</option>`).join('')}</select><input id='ap' type='number' min='1' placeholder='Price (₹)'><input id='am' type='number' min='1' placeholder='MRP (₹)'><input id='aq' type='number' min='1' placeholder='Min. order (packs)'><input id='as' type='number' min='0' placeholder='Stock (packs)'><input id='ab' type='number' min='0' placeholder='Bulk price (₹)'><input id='apc' type='number' min='0' placeholder='Purchase price (₹, admin only)'><input id='ag' type='number' min='0' placeholder='GST % (default 18)'><input id='ae' placeholder='Emoji' maxlength='4'><button class='add' data-do='addp'>Add product</button></div>`);
const stock=()=>sec('Stock',tbl(['Product','In stock','Reorder at','Status','Receive (packs)','Cost per pack (₹)',''],P.map(p=>[`${p.e} ${esc(p.n)}`,p.s,p.moq*3,low(p)?'Low':'OK',`<input type='number' min='1' id='rq${p.id}'>`,`<input type='number' min='0' id='rc${p.id}'>`,`<button data-do='recv' data-id='${p.id}'>Add stock</button>`]),''),'Stock value at selling price: '+inr(P.reduce((s,p)=>s+p.s*p.p,0)));
const tickets=()=>sec('Support tickets',DB.t.length?DB.t.map(t=>`<div class='tk'><b>${t.id}</b> · ${esc(t.cust)} · ${esc(t.ct)} · ${esc(t.tp)}${t.ord?' · '+esc(t.ord):''}<br><select data-ch='ts' data-id='${t.id}' aria-label='Ticket status'>${opts(TS,t.st)}</select>${thread(t)}<textarea id='r${t.id}' rows='2' placeholder='Write a reply'></textarea><button class='add' data-do='reply' data-id='${t.id}'>Send reply</button></div>`).join(''):`<div class='empty'>No tickets yet. Tickets raised in the Support desk appear here.</div>`,DB.t.length+' total');
const offers=()=>sec('Create an offer',`<div class='f addf'><input id='ot' placeholder='Offer title, e.g. Festive bulk sale'><input id='oc' placeholder='Code, e.g. FEST10'><input id='op' type='number' min='1' max='90' placeholder='Discount %'><button class='add' data-do='offer'>Publish offer</button></div>`)+sec('Offers',tbl(['Offer','Code','Discount','Status',''],DB.of.map(o=>[esc(o.t),esc(o.c),o.d+'%',o.on?'Live':'Paused',`<button data-do='otog' data-id='${o.id}'>${o.on?'Pause':'Resume'}</button> <button data-do='odel' data-id='${o.id}'>Delete</button>`]),'No offers yet.'))+sec('Upload a poster',`<div class='f'><input id='pt' placeholder='Poster title'><input id='pf' type='file' accept='image/*'><button class='add' data-do='poster'>Upload poster</button></div><div class='pg pos'>${DB.po.map(p=>`<div><img class='poster' alt='${esc(p.t)}' src='${p.s}'><button data-do='pdel' data-id='${p.id}'>Delete</button></div>`).join('')}</div>`,'Shown on the store home page');
const billing=()=>{let h=sec('Invoices',tbl(['Invoice','Customer','Taxable','GST','Total','Paid','Due','','Payment'],live().map(o=>{const t=tx(o);return['INV-'+o.id.slice(4),esc(o.cust),inr(t.b),inr(t.t),inr(t.tot),inr(paid(o)),inr(due(o)),`<button data-do='inv' data-id='${o.id}'>View</button>`,`<input type='number' min='1' id='pa${o.id}' placeholder='Amount'><button data-do='pay' data-id='${o.id}'>Record</button>`]}),'No invoices yet. Every placed order is billed here.'));const o=find(DB.o,sel);if(o){const t=tx(o);h+=sec('Invoice INV-'+o.id.slice(4),`<div class='pg'><p><b>Events by Buddies &amp; Bites</b><br>Bill to: ${esc(o.cust)} · ${esc(o.ph)}<br>GSTIN: ${esc(o.gst||'Not provided')}<br>Billing address: ${esc(o.bill||'-')}<br>Shipping address: ${esc(o.ship||'-')}${o.bulk?'<br><b>Bulk rates applied</b>':''}<br>Date: ${od(o)}</p>`+tbl(['Item','Qty','Rate','Taxable','GST %','CGST','SGST','Amount'],o.items.map(x=>{const v=x.q*rt(o,x),g=P[x.id].g||18,c=R(v*g/200);return[esc(x.n),x.q,inr(rt(o,x)),inr(v),g,inr(c),inr(c),inr(R(v+c*2))]}),'')+`<p>Taxable ${inr(t.b)} · GST ${inr(t.t)} · <b>Total ${inr(t.tot)}</b> · Paid ${inr(paid(o))} · <b>Due ${inr(due(o))}</b></p></div>`)}return h};
const ledger=()=>{const l=live(),cu={};l.forEach(o=>{const c=cu[o.cust]=cu[o.cust]||{b:0,p:0};c.b+=tx(o).tot;c.p+=paid(o)});const rin=l.reduce((s,o)=>s+paid(o),0),out=DB.l.reduce((s,x)=>s+x.a,0),cb=[...l.flatMap(o=>(o.pay||[]).map(x=>[x.at,'Payment received',o.id+' · '+esc(o.cust),inr(x.a),''])),...DB.l.map(x=>[x.at,x.k,esc(x.t),'',inr(x.a)])];
return `<div class='stats'><div>Money in<b>${inr(R(rin))}</b></div><div>Money out<b>${inr(R(out))}</b></div><div>Net cash<b>${inr(R(rin-out))}</b></div></div>`+sec('Customer ledger',tbl(['Customer','Billed','Received','Balance due'],Object.keys(cu).map(k=>[esc(k),inr(R(cu[k].b)),inr(R(cu[k].p)),inr(R(cu[k].b-cu[k].p))]),'No billed customers yet.'))+sec('Cash book',tbl(['When','Type','Details','Money in','Money out'],cb,'No entries yet.'))+sec('Add a purchase or expense',`<div class='f addf'><select id='ek'><option>Purchase</option><option>Expense</option></select><input id='et' placeholder='Details'><input id='ea' type='number' min='1' placeholder='Amount (₹)'><button class='add' data-do='exp'>Add entry</button></div>`)};
const tax=()=>{const l=live(),m={},r={};l.forEach(o=>{const k=od(o).slice(0,7),a=m[k]=m[k]||{n:0,b:0,t:0},t=tx(o);a.n++;a.b+=t.b;a.t+=t.t;o.items.forEach(x=>{const g=P[x.id].g||18,z=r[g]=r[g]||{b:0,t:0};z.b+=x.q*rt(o,x);z.t+=x.q*rt(o,x)*g/100})});return sec('GST summary by month',tbl(['Month','Invoices','Taxable value','CGST','SGST','Total GST','Invoice value'],Object.keys(m).sort().reverse().map(k=>[k,m[k].n,inr(R(m[k].b)),inr(R(m[k].t/2)),inr(R(m[k].t/2)),inr(R(m[k].t)),inr(R(m[k].b+m[k].t))]),'No billed orders yet.'),'Output tax on sales')+sec('By GST rate',tbl(['GST %','Taxable value','GST'],Object.keys(r).map(g=>[g+'%',inr(R(r[g].b)),inr(R(r[g].t))]),'No data yet.'),'Assumes sales within your state, so CGST plus SGST')};
const analytics=()=>{const dv=[...Array(14)].map((_,i)=>day(13-i)),vs=dv.map(d=>DB.v[d]||{f:0,b:0}),mx=Math.max(1,...vs.map(v=>Math.max(v.f,v.b))),l=live(),u={},c={},rt={};l.forEach(o=>o.items.forEach(x=>{u[x.id]=(u[x.id]||0)+x.q;const k=P[x.id].c;c[k]=(c[k]||0)+x.q;if(od(o)>=day(29))rt[x.id]=(rt[x.id]||0)+x.q}));const top=Object.keys(u).sort((a,b)=>u[b]-u[a]).slice(0,8),ck=Object.keys(c),oc=dv.map(d=>l.filter(o=>od(o)===d).length),none=`<div class='empty'>No sales yet.</div>`;
return sec('Daily visits, last 14 days',`<div class='pg'><p class='moq'>Store visitors</p>${bars(dv.map((d,i)=>[d.slice(5),vs[i].f]),mx,'b')}<p class='moq'>Admin opens</p>${bars(dv.map((d,i)=>[d.slice(5),vs[i].b]),mx)}</div>`)+sec('Orders per day',`<div class='pg'>${bars(dv.map((d,i)=>[d.slice(5),oc[i]]),Math.max(1,...oc),'b')}</div>`)+sec('Top products by packs sold',top.length?`<div class='pg'>${bars(top.map(i=>[esc(P[i].n),u[i]]),u[top[0]],'b')}</div>`:none)+sec('Demand by category',ck.length?`<div class='pg'>${bars(ck.map(k=>[CATS.filter(x=>x[0]===k)[0][2],c[k]]),Math.max(...ck.map(k=>c[k])))}</div>`:none)+sec('Stock cover and demand forecast',tbl(['Product','In stock','Expected demand, next 7 days','Days of stock left','Suggestion'],P.map(p=>{const a=(rt[p.id]||0)/30,d=a?Math.floor(p.s/a):null;return[esc(p.n),p.s,Math.round(a*7),d===null?'No recent sales':d+' days',d!==null&&d<14?'Reorder now':a?'OK':'Slow mover']}),''),'Based on the last 30 days')};
const bulk=()=>sec('Bulk order enquiries',tbl(['Enquiry','Customer','Phone','Requirement','Status',''],DB.q.map(q=>[q.id,esc(q.name),esc(q.ph),esc(q.msg),q.st,q.st==='Pending'?`<button data-do='eapp' data-id='${q.id}'>Approve as bulk buyer</button> <button data-do='erej' data-id='${q.id}'>Reject</button>`:'']),'No enquiries yet. Customers send them from My account.'),DB.q.filter(x=>x.st==='Pending').length+' pending')+sec('Customers',tbl(['Customer','Phone','GST number','Orders','Pricing',''],DB.u.map(u=>[esc(u.name),esc(u.ph),esc(u.gst||'Not given'),DB.o.filter(o=>o.uid===u.id).length,u.bulk?'Bulk rates':'Retail rates',`<button data-do='btog' data-id='${u.id}'>${u.bulk?'Switch to retail':'Make bulk buyer'}</button>`]),'No customer accounts yet.'));
const NAV=[['admin','Dashboard',dash],['admin-orders','Orders',orders],['admin-products','Products',products],['admin-stock','Stock',stock],['admin-tickets','Tickets',tickets],['admin-bulk','Bulk and customers',bulk],['admin-offers','Offers and posters',offers],['admin-billing','Billing',billing],['admin-ledger','Ledger',ledger],['admin-tax','Tax',tax],['admin-analytics','Analytics',analytics]];
const draw=()=>{const a=$('#ab');if(!ok){a.innerHTML=`<section class='sec gate'><h3>Admin sign in</h3><div class='f'><input id='apin' type='password' placeholder='Admin PIN' aria-label='Admin PIN'><button class='add' data-do='login'>Sign in</button></div></section>`;return}const h=location.hash.slice(1),p=NAV.filter(n=>n[0]===h)[0]||NAV[0];a.innerHTML=`<div class='apb'><b>Events by Buddies &amp; Bites · Admin</b><span><a href='../'>View store</a><button data-do='logout'>Sign out</button></span></div><nav class='an'>${NAV.map(n=>`<button data-go='${n[0]}' aria-current='${n[0]===p[0]?'page':'false'}'>${n[1]}</button>`).join('')}</nav><div class='pgb'>${p[2]()}</div>`};
window.admRoute=()=>{if(ok)hit('b');draw()};window.BB={tx,paid,due};
$('#vadmin').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='apin')$('#vadmin [data-do=login]').click()});
$('#vadmin').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!b.dataset.do)return;const d=b.dataset.do,id=b.dataset.id,g=i=>$('#'+i).value.trim();
if(d==='login'){if(g('apin')===PIN){ok=true;try{sessionStorage.setItem('adm','1')}catch(x){}hit('b');draw()}else toast('Wrong PIN')}
else if(d==='logout'){ok=false;try{sessionStorage.removeItem('adm')}catch(x){}draw()}
else if(d==='hide'){P[id].off=!P[id].off;save();render();draw()}
else if(d==='addp'){const n=g('an'),pr=+g('ap');if(!n||!pr)return toast('Enter a name and price');P.push({id:P.length,n,c:g('ac'),e:g('ae')||'🎁',p:pr,m:+g('am')||pr,r:0,rv:0,b:+g('ab')||0,pc:+g('apc')||0,moq:+g('aq')||1,bg:'#f7ecd9',s:+g('as')||0,g:+g('ag')||18});save();render();draw();toast('Product added')}
else if(d==='recv'){const q=+g('rq'+id),c=+g('rc'+id);if(!q)return toast('Enter the packs received');P[id].s+=q;if(c)DB.l.push({k:'Purchase',t:P[id].n+' × '+q,a:R(q*c),at:now()});save();render();draw();toast('Stock updated')}
else if(d==='reply'){const t=find(DB.t,id),v=g('r'+id);if(v){t.m.push({f:'s',t:v,at:now()});if(t.st==='Open')t.st='In progress';save();draw();toast('Reply sent')}}
else if(d==='offer'){const t=g('ot'),c=g('oc'),p=+g('op');if(!t||!c||!p)return toast('Enter a title, code and discount');DB.of.unshift({id:'O'+Date.now(),t,c:c.toUpperCase(),d:p,on:true});save();strip();draw()}
else if(d==='otog'){const o=find(DB.of,id);o.on=!o.on;save();strip();draw()}
else if(d==='odel'){DB.of=DB.of.filter(o=>o.id!==id);save();strip();draw()}
else if(d==='pdel'){DB.po=DB.po.filter(p=>p.id!==id);save();strip();draw()}
else if(d==='poster'){const f=$('#pf').files[0];if(!f)return toast('Choose an image first');const im=new Image(),ti=g('pt')||'Poster';im.onload=()=>{const k=Math.min(1,900/im.width),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);DB.po.unshift({id:'P'+Date.now(),t:ti,s:c.toDataURL('image/jpeg',.72)});save();strip();draw();toast('Poster uploaded')};im.src=URL.createObjectURL(f)}
else if(d==='eapp'||d==='erej'){const q=find(DB.q,id);q.st=d==='eapp'?'Approved':'Rejected';if(d==='eapp'){const u=find(DB.u,q.uid);if(u)u.bulk=true}save();draw()}
else if(d==='btog'){const u=find(DB.u,id);u.bulk=!u.bulk;save();draw()}
else if(d==='inv'){sel=id;draw()}
else if(d==='pay'){const a=+g('pa'+id),o=find(DB.o,id);if(!a)return toast('Enter the amount received');(o.pay=o.pay||[]).push({a,at:now()});save();draw();toast('Payment recorded')}
else if(d==='exp'){const t=g('et'),a=+g('ea');if(!t||!a)return toast('Enter details and an amount');DB.l.unshift({k:g('ek'),t,a,at:now()});save();draw()}});
$('#vadmin').addEventListener('change',e=>{const t=e.target,d=t.dataset.ch,id=t.dataset.id;if(!d)return;
if(d==='os'){const o=find(DB.o,id),was=o.st,c=t.value==='Cancelled';o.st=t.value;if(c&&was!=='Cancelled')o.items.forEach(x=>P[x.id].s+=x.q);else if(!c&&was==='Cancelled')o.items.forEach(x=>P[x.id].s=Math.max(0,P[x.id].s-x.q));save();render();draw()}
else if(d==='ts'){find(DB.t,id).st=t.value;save();draw()}
else if(d==='pp'){if(+t.value>0)P[id].p=+t.value;save();render();draw()}
else if(d==='pb'){P[id].b=Math.max(0,+t.value||0);save();draw()}
else if(d==='pc'){P[id].pc=Math.max(0,+t.value||0);save();draw()}
else if(d==='pg'){P[id].g=Math.max(0,+t.value||0);save();draw()}});
addEventListener('hashchange',admRoute);admRoute();
addEventListener('storage',e=>{if(e.key!=='bb_db'||!e.newValue)return;try{Object.assign(DB,JSON.parse(e.newValue));P=DB.p;draw()}catch(x){}});
})();
</script>
